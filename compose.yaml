services:
  api:
    image: ${IMAGE:-repo-chat:latest}
    build: .
    command: api
    env_file: .env
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/fastapi/full-stack-fastapi-template}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15m
    restart: unless-stopped

  bot:
    image: ${IMAGE:-repo-chat:latest}
    command: bot
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
